<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Garbage Can Race</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/": "./node_modules/three/",
          "troika-three-text": "./node_modules/troika-three-text/dist/troika-three-text.esm.js",
          "troika-three-utils": "./node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
          "troika-worker-utils": "./node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
          "webgl-sdf-generator": "./node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
          "bidi-js": "./node_modules/bidi-js/dist/bidi.mjs",
          "@rb/halo": "./node_modules/@rb/halo/src/core.js",
          "@rb/halo/hud": "./node_modules/@rb/halo/src/hud.js",
          "@rb/halo/input": "./node_modules/@rb/halo/src/input/index.js",
          "@rb/halo/ui": "./node_modules/@rb/halo/src/ui/index.js",
          "@rb/halo/curve-surface": "./node_modules/@rb/halo/src/curve-surface.js",
          "@rb/halo/": "./node_modules/@rb/halo/",
          "@rb/arcade/audio": "./node_modules/@rb/arcade/src/audio.js",
          "@rb/arcade/presentation": "./node_modules/@rb/arcade/src/presentation.js",
          "@rb/arcade/course": "./node_modules/@rb/arcade/src/course.js",
          "@rb/arcade/racing": "./node_modules/@rb/arcade/src/racing.js",
          "@rb/arcade/entry": "./node_modules/@rb/arcade/src/entry.js"
        }
      }
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #9ec8ea;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #14110e;
      }
      #splash img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #enter-vr {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 16;
        box-sizing: border-box;
        min-width: 240px;
        padding: 46px 56px;
        border: 0;
        border-radius: 0;
        appearance: none;
        cursor: pointer;
        background-color: #14190c;
        background-image:
          url("./assets/hud/tl.png"),
          url("./assets/hud/tr.png"),
          url("./assets/hud/bl.png"),
          url("./assets/hud/br.png"),
          url("./assets/hud/top.png"),
          url("./assets/hud/bottom.png"),
          url("./assets/hud/left.png"),
          url("./assets/hud/right.png"),
          url("./assets/hud/center.png");
        background-repeat: no-repeat;
        background-size:
          40px 40px,
          40px 40px,
          40px 40px,
          40px 40px,
          calc(100% - 80px) 40px,
          calc(100% - 80px) 40px,
          40px calc(100% - 80px),
          40px calc(100% - 80px),
          calc(100% - 80px) calc(100% - 80px);
        background-position:
          left top,
          right top,
          left bottom,
          right bottom,
          center top,
          center bottom,
          left center,
          right center,
          center;
        color: #f3e2b0;
        font: 700 16px/1.2 system-ui, sans-serif;
        text-shadow:
          0 1px 0 #1a1408,
          1px 0 0 #1a1408,
          -1px 0 0 #1a1408,
          0 -1px 0 #1a1408;
      }
      #enter-vr[hidden] {
        display: none !important;
      }
    </style>
    <link rel="stylesheet" href="./src/game-ui.css" />
  </head>
  <body>
    <div id="splash">
      <img src="./docs/hero.png" alt="Garbage Can Race" />
    </div>
    <canvas id="c"></canvas>
    <button id="enter-vr" type="button" hidden>Enter VR</button>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
