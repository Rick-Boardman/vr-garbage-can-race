<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Garbage Can Race</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/": "./node_modules/three/",
          "troika-three-text": "./node_modules/troika-three-text/dist/troika-three-text.esm.js",
          "troika-three-utils": "./node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
          "troika-worker-utils": "./node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
          "webgl-sdf-generator": "./node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
          "bidi-js": "./node_modules/bidi-js/dist/bidi.mjs",
          "@rb/halo": "./node_modules/@rb/halo/src/core.js"
        }
      }
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #9ec8ea;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #14110e;
      }
      #splash img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #lobby[hidden],
      #lobby-invite[hidden],
      #lobby-solo[hidden],
      #start-countdown[hidden],
      #hill-start[hidden],
      #hill-leave[hidden],
      #hill-lobby[hidden],
      #hill-wait[hidden] {
        display: none !important;
      }
      #lobby {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: grid;
        grid-template-columns: minmax(180px, 240px) minmax(0, 1fr) minmax(200px, 280px);
        grid-template-rows: auto minmax(0, 1fr);
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
        background: #14110e;
        color: #f3ead7;
        font: 16px/1.4 system-ui, sans-serif;
      }
      #lobby-header {
        grid-column: 1 / -1;
      }
      #lobby h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
      #lobby h2 {
        margin: 0 0 8px;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #lobby-status:empty {
        display: none;
      }
      #lobby-people,
      #lobby-games,
      #lobby-log {
        overflow: auto;
      }
      #lobby-center {
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: 8px;
      }
      #lobby #lobby-solo {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 2;
        transform: translate(-50%, -50%);
        margin: 0;
        max-width: calc(100% - 48px);
        padding: 28px 36px;
        border-radius: 16px;
        font-size: clamp(32px, 5vw, 56px);
        font-weight: 700;
        line-height: 1.1;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      #lobby #lobby-solo span {
        display: block;
      }
      #lobby #lobby-solo span:first-child {
        white-space: nowrap;
      }
      #lobby #lobby-solo span:last-child {
        margin-top: 12px;
        font-size: 0.48em;
        font-weight: 600;
        line-height: 1.25;
      }
      @media (max-width: 800px) {
        #lobby #lobby-solo span:first-child {
          white-space: normal;
        }
      }
      #lobby-log {
        flex: 1;
        padding: 8px 0;
      }
      #lobby-log p,
      #lobby-names,
      .lobby-game p,
      .lobby-empty {
        margin: 0 0 6px;
      }
      #lobby-code {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.18em;
      }
      #lobby label {
        display: block;
        margin: 0 0 8px;
      }
      #lobby input,
      #lobby select {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        font: inherit;
      }
      #lobby button,
      #lobby-invite button,
      #hill-start,
      #hill-leave,
      #hill-lobby {
        margin: 4px 8px 4px 0;
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        background: #f2c879;
        color: #14110e;
        font: inherit;
      }
      #lobby button:disabled {
        opacity: 0.45;
      }
      #lobby .lobby-pick {
        margin: 0 0 10px;
      }
      #lobby .lobby-pick > span {
        display: block;
        margin: 0 0 4px;
      }
      #lobby .lobby-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #lobby .lobby-swatches button {
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 1px solid #f3ead7;
        border-radius: 6px;
      }
      #lobby .lobby-swatches button[aria-pressed="true"] {
        outline: 2px solid #f2c879;
        outline-offset: 2px;
      }
      #lobby-side {
        min-height: 0;
        overflow: auto;
      }
      #lobby .lobby-choices {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #lobby .lobby-choices button {
        margin: 0;
        padding: 4px 8px;
      }
      #lobby .lobby-choices button[aria-pressed="true"] {
        outline: 2px solid #f2c879;
        outline-offset: 1px;
      }
      .lobby-person,
      .lobby-game {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      #lobby-composer {
        display: flex;
        gap: 8px;
      }
      #lobby-composer input {
        flex: 1;
        margin: 0;
      }
      #lobby-invite {
        position: fixed;
        left: 50%;
        top: 24px;
        z-index: 18;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #f3ead7;
        color: #14110e;
        font: 16px/1.4 system-ui, sans-serif;
      }
      #lobby-invite p {
        margin: 0 8px 0 0;
      }
      #start-countdown {
        position: fixed;
        inset: 0;
        z-index: 16;
        display: grid;
        place-items: center;
        margin: 0;
        pointer-events: none;
        color: #f3ead7;
        font: 96px/1 system-ui, sans-serif;
        text-shadow: 0 2px 0 #14110e;
      }
      #hill-bar {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 17;
        display: flex;
        gap: 8px;
      }
      #hill-start,
      #hill-leave,
      #hill-lobby {
        margin: 0;
      }
      #hill-wait {
        position: fixed;
        left: 50%;
        bottom: 72px;
        z-index: 17;
        transform: translateX(-50%);
        max-width: min(720px, calc(100% - 48px));
        margin: 0;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(20, 17, 14, 0.82);
        color: #f3ead7;
        font: 16px/1.35 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      @media (max-width: 800px) {
        #lobby {
          grid-template-columns: 1fr;
          overflow: auto;
        }
        #lobby-header {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="./docs/hero.png" alt="Garbage Can Race" />
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
